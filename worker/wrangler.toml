name = "whisperash-sync"
main = "src/index.js"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "whisperash"
# Replace with the id printed by: npx wrangler d1 create whisperash
database_id = "00000000-0000-0000-0000-000000000000"

# Secrets (set with `npx wrangler secret put NAME`, never written here):
#   PEPPER       - long random string mixed into every password hash
#   SIGNUP_CODE  - optional; if set, new accounts need this code to register
